<!DOCTYPE html>

<html>
　<head>
　　<meta name="viewport" content="width=device-width, initial-scale=1.0">
　<style>
   #left {
  position: absolute;
  left: 10px;
}

button {
  touch-action: manipulation;
}

#right {
  position: absolute;
  right: 10px;
}
   #box {width: 300px;height: 300px;background-color: red;}
   #snake {width: 25px;height: 25px;background-color: blue;position: relative;left: 50px;}
   #apple {width: 25px;height: 25px;background-color: green;position: relative;}
 </style>
　</head>

　<body>
   <button id="right">右</button>
   <button id="left">左</button>
   <button id="up">上</button>
   <button id="down">下</button>
　　<h1> ヘビゲーム </h1>
　　<div id="box">
   <div id="snake"></div>
   <div id="apple">🍎</div>
   </div>
   
  <script>
   const snake=document.getElementById("snake")
   const apple = document.getElementById("apple")
   let snakeX = 50
   let snakeY = 0
   let appleX = 75
   let appleY = 150
   const right = document.getElementById("right")
   const left = document.getElementById("left")
   const up = document.getElementById("up")
   const down = document.getElementById("down")
   const audioCtx = new AudioContext()
   function checkApple() {if (snakeX == appleX && snakeY == appleY) {
    appleX = Math.floor(Math.random() * 12) * 25
    appleY = Math.floor(Math.random() * 12) * 25
    const oscillator = audioCtx.createOscillator()
    oscillator.connect(audioCtx.destination)
    oscillator.frequency.value = 500
    oscillator.start()
    oscillator.stop(audioCtx.currentTime + 0.2)
    apple.style.left = appleX + "px"
    apple.style.top = appleY + "px"
}

}
   right.addEventListener("click", function() {
    if (snakeX < 275) {
        snakeX = snakeX + 25
        snake.style.left = snakeX + "px"}
        checkApple()
    })
    left.addEventListener("click", function() {
    if (snakeX > 0) {
        snakeX = snakeX - 25
        snake.style.left = snakeX + "px"}
        checkApple()
    })
    up.addEventListener("click", function() {
    if (snakeY > 0) {
        snakeY = snakeY - 25
        snake.style.top = snakeY + "px"}
        checkApple()
    })
    down.addEventListener("click", function() {
    if (snakeY < 275) {
        snakeY = snakeY + 25
        snake.style.top = snakeY + "px"
        checkApple()
     }
})
    apple.style.left = appleX + "px"
    apple.style.top = appleY + "px"
  
  </script>
   
</body>

</html>
